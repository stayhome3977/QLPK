services:
  - type: web
    name: qlpk-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_NAME
        value: "QLPK Da Lieu API"
      - key: APP_ENV
        value: "production"
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SECRET_KEY
        sync: false   # Set in Render Dashboard → Environment
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: DATABASE_URL
        sync: false   # Set in Render Dashboard → Environment
      - key: CORS_ORIGINS
        value: "https://frontend-d0oz.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: BACKEND_CORS_ORIGINS
        value: "https://frontend-d0oz.onrender.com"
      - key: FRONTEND_URL
        value: "https://frontend-d0oz.onrender.com"
      - key: DEFAULT_ADMIN_EMAIL
        value: "admin@qlpk.vn"
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false   # Set in Render Dashboard → Environment
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false   # Set in Render Dashboard → Environment
      - key: SMTP_PASSWORD
        sync: false   # Set in Render Dashboard → Environment
      - key: FROM_EMAIL
        sync: false   # Set in Render Dashboard → Environment
      - key: FROM_NAME
        value: "Hospital System"
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: UPLOAD_DIR
        value: "uploads/"
